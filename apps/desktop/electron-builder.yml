appId: com.pi-gui.desktop
productName: pi-gui
copyright: Copyright 2026 Matthew Lam
electronVersion: 34.5.8
compression: maximum
electronLanguages:
  - en
  - en_GB
  - zh_CN
  - zh_TW

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.mts"
  - "!**/*.cts"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.md"
  - "!**/*.markdown"
  - "!**/docs/**/*"
  - "!**/example{,s}/**/*"
  - "!**/test{,s}/**/*"
  - "!**/__tests__/**/*"
  - "!**/coverage/**/*"
  - "!**/node_modules/@types/**/*"
  - "!**/node_modules/@xterm/**/*"
  - "!**/node_modules/react/**/*"
  - "!**/node_modules/react-dom/**/*"
  - "!**/node_modules/react-markdown/**/*"
  - "!**/node_modules/remark-gfm/**/*"
  - "!**/node_modules/remark-*/*"
  - "!**/node_modules/unified/**/*"
  - "!**/node_modules/vfile{,-message}/**/*"
  - "!**/node_modules/unist-util-*/*"
  - "!**/node_modules/micromark{,-*}/**/*"
  - "!**/node_modules/mdast-util-*/*"
  - "!**/node_modules/hast-util-{to-jsx-runtime,whitespace}/**/*"
  - "!**/node_modules/character-{entities,entities-html4,entities-legacy,reference-invalid}/**/*"
  - "!**/node_modules/{comma,space}-separated-tokens/**/*"
  - "!**/node_modules/decode-named-character-reference/**/*"
  - "!**/node_modules/parse-entities/**/*"
  - "!**/node_modules/stringify-entities/**/*"
  - "!**/node_modules/property-information/**/*"
  - "!**/node_modules/html-url-attributes/**/*"
  - "!**/node_modules/inline-style-parser/**/*"
  - "!**/node_modules/style-to-{js,object}/**/*"
  - "!**/node_modules/{bail,ccount,devlop,dequal,longest-streak,markdown-table,trim-lines,trough,zwitch}/**/*"
  - "!**/node_modules/highlight.js/es/**/*"
  - "!**/node_modules/highlight.js/scss/**/*"
  - "!**/node_modules/highlight.js/styles/**/*"
  - "!**/node_modules/@anthropic-ai/sdk/**/*.js"
  - "!**/node_modules/@google/genai/dist/**/*.cjs"
  - "!**/node_modules/@google/genai/dist/web/**/*"
  - "!**/node_modules/openai/**/*.js"
  - "!**/node_modules/@mariozechner/clipboard-darwin-universal/**/*"
  - "!**/node_modules/koffi/src/**/*"
  - "!**/node_modules/koffi/vendor/**/*"
  - "!**/node_modules/koffi/build/koffi/darwin_x64/**/*"
  - "!**/node_modules/koffi/build/koffi/freebsd_*/**/*"
  - "!**/node_modules/koffi/build/koffi/linux_*/**/*"
  - "!**/node_modules/koffi/build/koffi/musl_*/**/*"
  - "!**/node_modules/koffi/build/koffi/openbsd_*/**/*"
  - "!**/node_modules/koffi/build/koffi/win32_*/**/*"
  - "!**/node_modules/node-pty/deps/winpty/**/*"
  - "!**/node_modules/node-pty/scripts/**/*"
  - "!**/node_modules/node-pty/src/**/*"
  - "!**/node_modules/node-pty/prebuilds/darwin-x64/**/*"
  - "!**/node_modules/node-pty/prebuilds/win32-*/*"

extraResources:
  - from: resources/icon.png
    to: icon.png

asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  - "**/node_modules/node-pty/**/*"
  - "**/node_modules/.pnpm/node-pty*/node_modules/node-pty/**/*"

artifactName: ${productName}-${version}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  notarize: true
  target:
    - target: dmg
      arch: arm64
  darkModeSupport: true
  extraFiles:
    - from: build/native/pi-gui-notification-status-helper
      to: MacOS/pi-gui-notification-status-helper

linux:
  category: Development
  executableName: pi-gui
  target:
    - target: AppImage

toolsets:
  appimage: "1.0.2"

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

publish:
  provider: github
  owner: minghinmatthewlam
  repo: pi-gui
